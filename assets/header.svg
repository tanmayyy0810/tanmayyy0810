<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Tanmay Rastogi, Full-Stack Development, AI and Machine Learning, IoT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="0.5" stop-color="#0A6CFF"/>
      <stop offset="1" stop-color="#120458"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- back wave (slow) -->
    <path fill="#0d1117" fill-opacity="0.35" d="M0 238 Q300 188 600 238 T1200 238 T1800 238 T2400 238 L2400 300 L0 300 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <!-- front wave (faster) -->
    <path fill="#0d1117" fill-opacity="0.6" d="M0 262 Q300 292 600 262 T1200 262 T1800 262 T2400 262 L2400 300 L0 300 Z">
      <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </path>

    <text x="600" y="140" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="700" letter-spacing="-1">Tanmay Rastogi</text>
    <text x="600" y="190" text-anchor="middle" fill="#e0f2fe" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">Full-Stack Development  |  AI &amp; Machine Learning  |  IoT</text>
  </g>
</svg>
