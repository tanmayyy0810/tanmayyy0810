<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Tanmay Rastogi, Full-Stack Development, AI and Machine Learning, IoT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="0.5" stop-color="#0A6CFF"/>
      <stop offset="1" stop-color="#120458"/>
    </linearGradient>
    <!-- main shape: gradient with a wavy bottom edge, transparent below it -->
    <path id="shape" d="M0 0 H1200 V222 C1000 262 800 196 600 228 C400 260 200 206 0 238 Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
  </defs>

  <use href="#shape" fill="url(#bg)"/>

  <!-- translucent dark waves, clipped to the main shape -->
  <g clip-path="url(#clip)">
    <path fill="#000" fill-opacity="0.22" d="M0 200 Q300 160 600 200 T1200 200 T1800 200 T2400 200 L2400 270 L0 270 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="16s" repeatCount="indefinite"/>
    </path>
    <path fill="#000" fill-opacity="0.28" d="M0 222 Q300 252 600 222 T1200 222 T1800 222 T2400 222 L2400 270 L0 270 Z">
      <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="600" y="115" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="700" letter-spacing="-1">Tanmay Rastogi</text>
  <text x="600" y="160" text-anchor="middle" fill="#e0f2fe" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600">Full-Stack Development  |  AI &amp; Machine Learning  |  IoT</text>
</svg>
