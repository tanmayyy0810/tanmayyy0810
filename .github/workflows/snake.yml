name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate blue contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tanmayyy0810
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%234CC9F0&color_dots=%230D1117,%23120458,%230A3E91,%230A6CFF,%234CC9F0
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
